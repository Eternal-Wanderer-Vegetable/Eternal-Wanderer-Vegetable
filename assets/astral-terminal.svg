<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Astral Terminal — Swiss Edition V2.2</title>
<desc id="desc">A refined dark Swiss-inspired GitHub banner with lighter typography and a dimensional orbital diagram. Labels are cleaner and orbital motion is continuously looping with more natural desynchronization.</desc>
